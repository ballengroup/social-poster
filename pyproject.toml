[project]
name = "social-poster"
version = "0.1.0"
description = "Post once, repurpose everywhere: TikTok drafts via the official API plus rule-checked Amazon Influencer upload kits."
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
social-poster = "social_poster.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["social_poster*"]
