name: TikTok to LTK kits

on:
  schedule:
    - cron: "17 14 * * *" # daily, ~7am Pacific
  workflow_dispatch:
    inputs:
      first_run:
        description: "First run: skip existing videos, but make one sample kit from the newest"
        type: boolean
        default: false

permissions:
  contents: write # to commit state.json back

concurrency:
  group: tiktok-to-ltk
  cancel-in-progress: false

jobs:
  build-kits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Write config and Drive credentials
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          [ -f config.yaml ] || cp config.example.yaml config.yaml
          if [ -n "$GDRIVE_SA_JSON" ]; then
            printf '%s' "$GDRIVE_SA_JSON" > "$RUNNER_TEMP/sa.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          fi

      - name: First run, skip back catalog
        if: ${{ inputs.first_run }}
        env:
          TIKTOK_HANDLE: ${{ vars.TIKTOK_HANDLE }}
          TIKTOK_SEC_UID: ${{ vars.TIKTOK_SEC_UID }}
        run: python -m social_poster --mark-all-done --keep-newest 1

      - name: Build kits for new TikToks
        env:
          TIKTOK_HANDLE: ${{ vars.TIKTOK_HANDLE }}
          TIKTOK_SEC_UID: ${{ vars.TIKTOK_SEC_UID }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python -m social_poster

      - name: Keep kits as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltk-kits
          path: kits/
          if-no-files-found: ignore
          retention-days: 14

      - name: Save progress
        if: always()
        run: |
          [ -f state.json ] || exit 0
          git config user.name "tiktok-to-ltk bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || { git commit -m "Record processed TikToks" && git push; }
